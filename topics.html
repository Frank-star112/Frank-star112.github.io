<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>爆款铺 · 小红书选题灵感库</title>
<meta name="description" content="小红书选题灵感库，8大赛道80+爆款选题方向，点击一键生成标题。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #e7e9ee;
    --text: #1f2230; --text-dim: #707686; --text-mute: #a3a8b5;
    --accent: #ff2e63; --accent-2: #ff6b35;
    --grad: linear-gradient(135deg, #ff2e63 0%, #ff6b35 100%);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
  .logo .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 14px; color: #fff; }
  .nav-tabs a { color: var(--text-dim); text-decoration: none; font-size: 13px; margin-left: 14px; }
  .nav-tabs a.cur { color: var(--accent); font-weight: 600; }
  .hero { padding: 30px 0 14px; text-align: center; }
  .hero h1 { font-size: 25px; font-weight: 800; }
  .hero p { color: var(--text-dim); margin-top: 8px; font-size: 14px; }
  .cat { margin-top: 18px; }
  .cat h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .cat h2 .pin { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px){ .list { grid-template-columns: 1fr; } }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; font-size: 14px; color: var(--text); text-decoration: none; display: block; cursor: pointer; }
  .item:hover { border-color: var(--accent); background: #fff7f9; }
  footer { margin-top: 40px; border-top: 1px solid var(--border); padding: 22px 0; color: var(--text-mute); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="logo"><div class="dot">爆</div>爆款铺</div>
    <div class="nav-tabs">
      <a href="index.html">标题生成器</a>
      <a href="topics.html" class="cur">选题灵感库</a>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1>小红书选题灵感库</h1>
    <p>8 大赛道，点任意选题直接生成爆款标题 👇</p>
  </section>
  <div id="cats"></div>
</div>

<footer>爆款铺 · 创作者的标题灵感库 · 免费工具，由阿坎打造</footer>

<script>
const data = {
  "美妆护肤": ["新手化妆","油皮护肤","平价彩妆","学生党妆容","敏感肌","伪素颜","早C晚A","防晒","口红试色","底妆不卡粉"],
  "减脂健身": ["减脂早餐","居家健身","暴汗操","掉秤食谱","腹肌训练","跳绳","轻断食","低卡零食","跑步姿势","体态矫正"],
  "穿搭时尚": ["小个子穿搭","通勤穿搭","显瘦穿搭","秋冬叠穿","平价衣柜","梨形身材","男友风","配色公式","淘宝神店","旧衣改造"],
  "美食探店": ["一人食","空气炸锅","快手菜","减脂餐","早餐灵感","咖啡探店","宝藏小店","下午茶","便当","汤羹"],
  "家居收纳": ["出租屋改造","小户型收纳","桌面好物","懒人神器","断舍离","厨房收纳","平价软装","灯光氛围","绿植","清洁妙招"],
  "职场成长": ["简历模板","面试话术","副业搞钱","Excel技巧","PPT模板","时间管理","汇报模板","职场穿搭","沟通技巧","升职加薪"],
  "母婴育儿": ["宝宝辅食","早教游戏","待产包","哄睡技巧","绘本推荐","育儿好物","产后恢复","亲子穿搭","幼儿园准备","感统训练"],
  "情感生活": ["亲密关系","独居生活","脱单技巧","情绪价值","异地恋","自我成长","断联","仪式感","边界感","治愈文案"]
};
const wrap = document.getElementById('cats');
Object.keys(data).forEach(cat => {
  const box = document.createElement('div');
  box.className = 'cat';
  box.innerHTML = '<h2><span class="pin"></span>' + cat + '</h2>';
  const list = document.createElement('div');
  list.className = 'list';
  data[cat].forEach(t => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = 'index.html?kw=' + encodeURIComponent(t);
    a.textContent = t;
    list.appendChild(a);
  });
  box.appendChild(list);
  wrap.appendChild(box);
});
</script>
</body>
</html>
