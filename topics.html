<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #fbf7f8; --card: #ffffff; --border: #f0e6e9;
    --text: #1c1b22; --text-dim: #6f6a76; --text-mute: #ab9aa3;
    --accent: #ff2e63; --accent-2: #ff7a3d;
    --grad: linear-gradient(135deg, #ff2e63 0%, #ff7a3d 100%);
    --grad-soft: linear-gradient(135deg, rgba(255,46,99,0.08) 0%, rgba(255,122,61,0.08) 100%);
    --radius: 18px; --shadow: 0 8px 30px rgba(255,46,99,0.08);
    --shadow-hover: 0 14px 40px rgba(255,46,99,0.16);
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; min-height: 100vh; overflow-x: hidden; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }

  header { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.86); backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--border); }
  .nav { display: flex; align-items: center; gap: 12px; height: 60px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; flex-shrink: 0; }
  .logo .dot { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 15px; color: #fff; box-shadow: 0 4px 12px rgba(255,46,99,0.3); }
  .nav-scroll { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px 0; }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-scroll a { color: var(--text-dim); text-decoration: none; font-size: 12.5px; padding: 7px 13px; border-radius: 999px; transition: all .2s; white-space: nowrap; border: 1px solid transparent; }
  .nav-scroll a.cur { color: #fff; background: var(--grad); font-weight: 700; box-shadow: 0 4px 12px rgba(255,46,99,0.25); }
  .nav-scroll a:not(.cur):hover { background: rgba(255,46,99,0.07); }

  .hero { position: relative; padding: 44px 0 20px; text-align: center; overflow: hidden; }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(50px); opacity: .5; z-index: 0; }
  .hero::before { width: 230px; height: 230px; background: radial-gradient(circle, #ffd0dd, transparent 70%); top: -50px; left: -40px; }
  .hero::after { width: 250px; height: 250px; background: radial-gradient(circle, #ffe0c7, transparent 70%); top: -30px; right: -60px; }
  .hero > * { position: relative; z-index: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--accent); background: rgba(255,46,99,0.08); padding: 6px 14px; border-radius: 999px; margin-bottom: 14px; }
  .hero h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.25; }
  .hero p { color: var(--text-dim); margin: 12px auto 0; font-size: 14.5px; max-width: 440px; }

  .search { position: relative; margin-top: 20px; z-index: 1; }
  .search input { width: 100%; -webkit-appearance: none; background: #fff; border: 1.5px solid var(--border); border-radius: 13px; padding: 14px 16px 14px 44px; font-size: 15px; outline: none; color: var(--text); transition: border-color .2s, box-shadow .2s; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,46,99,0.1); }
  .search .mag { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 17px; color: var(--text-mute); }

  .cat { margin-top: 22px; }
  .cat-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .cat-head .pin { width: 32px; height: 32px; border-radius: 9px; background: var(--grad-soft); display: grid; place-items: center; font-size: 16px; border: 1px solid var(--border); }
  .cat-head h2 { font-size: 16.5px; font-weight: 800; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px){ .list { grid-template-columns: 1fr; } }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 14px 15px;
    font-size: 14.5px; color: var(--text); text-decoration: none; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: transform .16s, box-shadow .16s, border-color .16s; font-weight: 500;
    animation: fade .4s ease backwards;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .item:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .item .arrow { color: var(--accent-2); font-weight: 700; opacity: 0; transform: translateX(-4px); transition: all .18s; }
  .item:hover .arrow { opacity: 1; transform: translateX(0); }
  .item.hide { display: none; }

  .more { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .more h3 { width: 100%; font-size: 15px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
  .more a { display: inline-flex; align-items: center; gap: 4px; padding: 9px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all .18s; }
  .more a span { display: none; }
  .more a:hover { border-color: var(--accent); background: rgba(255,46,99,0.05); box-shadow: var(--shadow-hover); }
  .more a:hover span { transform: none; }
  footer { margin-top: 40px; padding: 26px 0 38px; color: var(--text-mute); font-size: 12px; text-align: center; }
  footer .heart { color: var(--accent); }

  .share-card { margin-top: 32px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; box-shadow: var(--shadow); text-align: center; }
  .share-card h3 { font-size: 17px; font-weight: 800; }
  .share-card .sub { color: var(--text-mute); font-size: 13px; margin: 7px 0 18px; }
  .share-body { display: flex; align-items: center; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .share-card .qr { width: 132px; height: 132px; border-radius: 12px; border: 1px solid var(--border); }
  .share-side { text-align: left; }
  .link-box { font-size: 12.5px; color: var(--text-dim); background: #fdfafb; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; max-width: 230px; word-break: break-all; margin-bottom: 10px; }
  .copy-link { background: var(--grad); color: #fff; border: none; border-radius: 9px; padding: 11px 20px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(255,46,99,0.25); transition: transform .12s; }
  .copy-link:active { transform: scale(0.97); }
  @media (max-width: 640px){ .share-body { flex-direction: column; } .share-side { text-align: center; } .link-box { max-width: 100%; } }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1c1b22; color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all .28s cubic-bezier(.2,.8,.2,1); pointer-events: none; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<footer>爆款铺 · 创作者的免费工具站 · 由 <span class="heart">阿坎</span> 打造 · 永久免费</footer>

<script>
const data = {
  "💄 美妆护肤": ["新手化妆","油皮护肤","平价彩妆","学生党妆容","敏感肌","伪素颜","早C晚A","防晒","口红试色","底妆不卡粉"],
  "🏃 减脂健身": ["减脂早餐","居家健身","暴汗操","掉秤食谱","腹肌训练","跳绳","轻断食","低卡零食","跑步姿势","体态矫正"],
  "👗 穿搭时尚": ["小个子穿搭","通勤穿搭","显瘦穿搭","秋冬叠穿","平价衣柜","梨形身材","男友风","配色公式","淘宝神店","旧衣改造"],
  "🍜 美食探店": ["一人食","空气炸锅","快手菜","减脂餐","早餐灵感","咖啡探店","宝藏小店","下午茶","便当","汤羹"],
  "🏠 家居收纳": ["出租屋改造","小户型收纳","桌面好物","懒人神器","断舍离","厨房收纳","平价软装","灯光氛围","绿植","清洁妙招"],
  "💼 职场成长": ["简历模板","面试话术","副业搞钱","Excel技巧","PPT模板","时间管理","汇报模板","职场穿搭","沟通技巧","升职加薪"],
  "👶 母婴育儿": ["宝宝辅食","早教游戏","待产包","哄睡技巧","绘本推荐","育儿好物","产后恢复","亲子穿搭","幼儿园准备","感统训练"],
  "💗 情感生活": ["亲密关系","独居生活","脱单技巧","情绪价值","异地恋","自我成长","断联","仪式感","边界感","治愈文案"]
};
const wrap = document.getElementById('cats');
const items = [];
Object.keys(data).forEach((cat, ci) => {
  const box = document.createElement('div');
  box.className = 'cat';
  box.innerHTML = '<div class="cat-head"><span class="pin">'+cat.split(' ')[0]+'</span><h2>'+cat.split(' ').slice(1).join(' ')+'</h2></div>';
  const list = document.createElement('div');
  list.className = 'list';
  data[cat].forEach((t, ti) => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = 'index.html?kw=' + encodeURIComponent(t);
    a.style.animationDelay = ((ci*0.04)+(ti*0.012)) + 's';
    a.innerHTML = '<span>'+t+'</span><span class="arrow">→</span>';
    list.appendChild(a);
    items.push({ el: a, text: t });
  });
  box.appendChild(list);
  wrap.appendChild(box);
});

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  items.forEach(it => {
    const hit = !q || it.text.toLowerCase().includes(q);
    it.el.classList.toggle('hide', !hit);
  });
});

function copyText(text){ if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>fb(text)); } else fb(text); }
function fb(text){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('请长按手动复制'); } document.body.removeChild(ta); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1200); }
const copyLinkBtn = document.getElementById('copyLinkBtn');
if (copyLinkBtn) {
  document.getElementById('linkBox').textContent = location.href;
  copyLinkBtn.addEventListener('click', function(){
    copyText(location.href);
    this.textContent = '✓ 已复制';
    const b = this;
    setTimeout(function(){ b.textContent = '复制链接'; }, 1300);
  });
}
</script>
